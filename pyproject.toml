[project]
name = "python-boilerplate"
version = "0.1.0"
description = "Minimal WSGI application for Wodby"
requires-python = ">=3.10"
dependencies = [
    "gunicorn>=23,<24",
]

[project.urls]
Repository = "https://github.com/wodby/python-boilerplate"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py310"
